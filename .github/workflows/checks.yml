name: Prototype checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'prototype/**']
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        timezone: [Asia/Tokyo, UTC]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/check.mjs
      - run: node --test test/*.test.js
      - run: node scripts/build.mjs
      # Preparation only. No deploy-pages action, Pages environment or write permissions.
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preview-${{ matrix.os }}-${{ matrix.timezone == 'UTC' && 'utc' || 'tokyo' }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
